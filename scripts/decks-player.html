<!doctype html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{TITLE}}</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
{{FONTS}}
<style>
html,body{margin:0;height:100%;background:#070c2b;overflow:hidden;-webkit-text-size-adjust:100%}
body{font-family:Roboto,system-ui,sans-serif}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#deck{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:0 0;direction:ltr;box-shadow:0 30px 120px rgba(0,0,0,.45)}
/* The slide format: a fixed 1920×1080 canvas, inline styles only; a <div> with no display is a column. */
#deck section{position:absolute;inset:0;width:1920px;height:1080px;box-sizing:border-box;overflow:hidden;display:flex;flex-direction:column;font-size:32px;line-height:1.4;opacity:0;visibility:hidden;transition:opacity .5s cubic-bezier(.2,.8,.2,1),visibility 0s .5s}
#deck section.on{opacity:1;visibility:visible;transition:opacity .5s cubic-bezier(.2,.8,.2,1),visibility 0s}
#deck section *{box-sizing:border-box}
#deck section div{display:flex;flex-direction:column}
#deck section h1,#deck section h2,#deck section h3,#deck section p,#deck section ul,#deck section ol{margin:0}
#deck section h1{font-size:96px;font-weight:600;line-height:1.1}
#deck section h2{font-size:64px;font-weight:600;line-height:1.15}
#deck section h3{font-size:44px;font-weight:600;line-height:1.2}
#deck section ul,#deck section ol{padding-inline-start:1.2em}
#deck section img{display:block}
#deck section a{color:inherit}
#deck section table{border-collapse:collapse;width:100%}
#deck section th{text-align:start;font-weight:700}
#deck section td,#deck section th{vertical-align:top}
#deck section x-shape,#deck section x-icon{display:block;flex:none}
#deck section x-shape svg{display:block;width:100%;height:100%}
#deck section .x-embed{border:0;background:transparent;display:block}
#deck section x-connector{display:none}
#deck section .x-wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
#bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;background:rgba(11,19,64,.82);border:1px solid rgba(255,255,255,.14);border-radius:999px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:#fff;font:500 14px/1 Roboto,system-ui,sans-serif;transition:opacity .4s;z-index:5;direction:ltr}
#bar.idle{opacity:0;pointer-events:none}
#bar button{all:unset;cursor:pointer;width:38px;height:38px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:#fff}
#bar button:hover{background:rgba(255,255,255,.12)}
#bar button:focus-visible{outline:2px solid #f8b716;outline-offset:1px}
#bar svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#count{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;color:rgba(255,255,255,.85)}
#progress{position:fixed;left:0;top:0;height:3px;background:#f8b716;transition:width .4s;z-index:5}
@media (prefers-reduced-motion:reduce){#deck section,#deck section.on{transition:none}}
</style>
</head>
<body>
<div id="progress"></div>
<div id="stage"><div id="deck">
{{SLIDES}}
</div></div>
<div id="bar" role="toolbar">
<button id="prev" type="button"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg></button>
<span id="count" aria-live="polite"></span>
<button id="next" type="button"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></button>
<button id="full" type="button"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>
<script id="assets" type="application/json">{{ASSETS}}</script>
<script>
(function () {
  var assets = JSON.parse(document.getElementById('assets').textContent);
  var deck = document.getElementById('deck');
  var slides = Array.prototype.slice.call(deck.querySelectorAll(':scope > section'));
  var rtl = document.documentElement.dir === 'rtl';
  var ar = document.documentElement.lang === 'ar';
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var cur = -1;

  var label = ar ? { prev: 'الشريحة السابقة', next: 'الشريحة التالية', full: 'ملء الشاشة' } : { prev: 'Previous slide', next: 'Next slide', full: 'Full screen' };
  ['prev', 'next', 'full'].forEach(function (k) { var b = document.getElementById(k); b.title = label[k]; b.setAttribute('aria-label', label[k]); });

  // Images are stored once and put back into every <img> that names them.
  deck.querySelectorAll('img[data-asset]').forEach(function (img) { img.src = assets[img.getAttribute('data-asset')]; });

  // A table's padding is its cells' padding.
  deck.querySelectorAll('table').forEach(function (t) {
    var p = t.style.padding;
    if (!p) return;
    t.style.padding = '';
    t.querySelectorAll('td,th').forEach(function (c) { if (!c.style.padding) c.style.padding = p; });
  });
  deck.querySelectorAll('table').forEach(function (t) {
    t.querySelectorAll('td,th').forEach(function (c) { if (!c.style.padding) c.style.padding = '0.35em 0.6em'; });
  });

  // Shapes: each kind fills its box; an arrow's head is the last 40% of its length.
  var NS = 'http://www.w3.org/2000/svg';
  function shape(el) {
    var cs = getComputedStyle(el);
    var fill = cs.backgroundColor && cs.backgroundColor !== 'rgba(0, 0, 0, 0)' ? cs.backgroundColor : cs.color;
    el.style.background = 'transparent';
    var kind = el.getAttribute('kind') || 'rect';
    var pts = {
      'arrow-right': '0,25 60,25 60,0 100,50 60,100 60,75 0,75',
      'arrow-left': '100,25 40,25 40,0 0,50 40,100 40,75 100,75',
      'arrow-down': '25,0 75,0 75,60 100,60 50,100 0,60 25,60',
      'arrow-up': '25,100 75,100 75,40 100,40 50,0 0,40 25,40',
      'diamond': '50,0 100,50 50,100 0,50'
    }[kind];
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.setAttribute('preserveAspectRatio', 'none');
    var node;
    if (pts) { node = document.createElementNS(NS, 'polygon'); node.setAttribute('points', pts); }
    else if (kind === 'ellipse') { node = document.createElementNS(NS, 'ellipse'); node.setAttribute('cx', 50); node.setAttribute('cy', 50); node.setAttribute('rx', 50); node.setAttribute('ry', 50); }
    else if (kind === 'line') { node = document.createElementNS(NS, 'line'); node.setAttribute('x1', 0); node.setAttribute('y1', 50); node.setAttribute('x2', 100); node.setAttribute('y2', 50); node.setAttribute('stroke', fill); node.setAttribute('vector-effect', 'non-scaling-stroke'); node.setAttribute('stroke-width', parseFloat(cs.borderTopWidth) || 2); }
    else { node = document.createElementNS(NS, 'rect'); node.setAttribute('width', 100); node.setAttribute('height', 100); }
    if (kind !== 'line') node.setAttribute('fill', fill);
    svg.appendChild(node);
    el.appendChild(svg);
  }
  deck.querySelectorAll('x-shape').forEach(shape);

  // Connectors: lines in their container's coordinates, with constant-size heads.
  function connectors(host) {
    var list = Array.prototype.filter.call(host.children, function (c) { return c.tagName === 'X-CONNECTOR'; });
    if (!list.length) return;
    var W = host.offsetWidth, H = host.offsetHeight;
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('class', 'x-wires');
    svg.setAttribute('width', W); svg.setAttribute('height', H);
    function num(v, size) { v = String(v || '0'); return v.slice(-1) === '%' ? parseFloat(v) / 100 * size : parseFloat(v); }
    list.forEach(function (c) {
      var cs = getComputedStyle(c);
      var color = cs.color, w = parseFloat(c.style.borderWidth) || 2;
      var x1 = num(c.getAttribute('x1'), W), y1 = num(c.getAttribute('y1'), H), x2 = num(c.getAttribute('x2'), W), y2 = num(c.getAttribute('y2'), H);
      var route = c.getAttribute('route') || 'straight', p;
      if (route === 'hv') p = [[x1, y1], [x2, y1], [x2, y2]];
      else if (route === 'vh') p = [[x1, y1], [x1, y2], [x2, y2]];
      else if (route === 'elbow') { var mx = (x1 + x2) / 2; p = [[x1, y1], [mx, y1], [mx, y2], [x2, y2]]; }
      else p = [[x1, y1], [x2, y2]];
      var head = c.getAttribute('head') || 'end';
      var hs = c.getAttribute('head-start') || (head === 'both' ? 'filled' : 'none');
      var he = c.getAttribute('head-end') || (head === 'end' || head === 'both' ? 'filled' : 'none');
      var L = 6 + w * 3;
      function arrow(a, b, style) {
        var dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d;
        var bx = b[0] - ux * L, by = b[1] - uy * L, nx = -uy * L * 0.55, ny = ux * L * 0.55;
        var poly = document.createElementNS(NS, style === 'open' ? 'polyline' : 'polygon');
        poly.setAttribute('points', [bx + nx, by + ny, b[0], b[1], bx - nx, by - ny].join(' '));
        if (style === 'open') { poly.setAttribute('fill', 'none'); poly.setAttribute('stroke', color); poly.setAttribute('stroke-width', w); poly.setAttribute('stroke-linejoin', 'round'); }
        else poly.setAttribute('fill', color);
        svg.appendChild(poly);
        return style === 'open' ? b : [bx + ux * 1, by + uy * 1];
      }
      var pts = p.map(function (q) { return q.slice(); });
      var line = document.createElementNS(NS, 'polyline');
      svg.appendChild(line);
      if (he !== 'none') pts[pts.length - 1] = arrow(p[p.length - 2], p[p.length - 1], he);
      if (hs !== 'none') pts[0] = arrow(p[1], p[0], hs);
      line.setAttribute('points', pts.map(function (q) { return q.join(','); }).join(' '));
      line.setAttribute('fill', 'none');
      line.setAttribute('stroke', color);
      line.setAttribute('stroke-width', w);
      if (c.style.borderStyle === 'dashed') line.setAttribute('stroke-dasharray', w * 3 + ' ' + w * 2);
      if (c.style.borderStyle === 'dotted') { line.setAttribute('stroke-dasharray', '0 ' + w * 2); line.setAttribute('stroke-linecap', 'round'); }
    });
    host.insertBefore(svg, host.firstChild);
  }
  slides.forEach(function (s) {
    s.classList.add('on'); // lay out once so containers have their sizes
    connectors(s);
    s.querySelectorAll('div').forEach(function (d) { if (d.style.position === 'relative') connectors(d); });
    s.classList.remove('on');
  });

  // Builds: data-build-in="effect [order] [auto]" on a slide's pinned children play in order as the slide arrives.
  var FX = {
    fade: [{}, {}],
    rise: [{ translate: '0 48px' }, { translate: '0 0' }],
    drop: [{ translate: '0 -48px' }, { translate: '0 0' }],
    left: [{ translate: '-72px 0' }, { translate: '0 0' }],
    right: [{ translate: '72px 0' }, { translate: '0 0' }],
    scale: [{ scale: '0.86' }, { scale: '1' }],
    pop: [{ scale: '0.6' }, { scale: '1' }]
  };
  function builds(s) {
    var els = Array.prototype.slice.call(s.querySelectorAll('[data-build-in]'));
    els.forEach(function (el) {
      var parts = el.getAttribute('data-build-in').trim().split(/\s+/);
      var fx = FX[parts[0]] || FX.fade, order = parseInt(parts[1], 10) || 0;
      var to = parseFloat(getComputedStyle(el).opacity);
      if (el.getAnimations) el.getAnimations().forEach(function (a) { a.cancel(); });
      if (reduce || !el.animate) return;
      var a = Object.assign({ opacity: 0 }, fx[0]), b = Object.assign({ opacity: isNaN(to) ? 1 : to }, fx[1]);
      el.animate([a, b], {
        duration: parts[0] === 'pop' ? 520 : 700,
        delay: 150 + order * 380,
        easing: parts[0] === 'pop' ? 'cubic-bezier(.34,1.56,.64,1)' : 'cubic-bezier(.2,.8,.2,1)',
        fill: 'backwards'
      });
    });
  }

  // Live embeds load while their slide is shown, so each one starts fresh and idle slides cost nothing.
  function embeds(s, on) {
    s.querySelectorAll('iframe.x-embed').forEach(function (f) {
      if (on) { if (!f.getAttribute('srcdoc')) f.setAttribute('srcdoc', f.getAttribute('data-page')); }
      else f.removeAttribute('srcdoc');
    });
  }

  function show(i, quiet) {
    i = Math.max(0, Math.min(slides.length - 1, i));
    if (i === cur) return;
    var prev = slides[cur];
    if (prev) { prev.classList.remove('on'); setTimeout(function () { if (!prev.classList.contains('on')) embeds(prev, false); }, 600); }
    cur = i;
    var s = slides[i];
    embeds(s, true);
    builds(s);
    s.classList.add('on');
    document.getElementById('count').textContent = (i + 1) + ' / ' + slides.length;
    document.getElementById('progress').style.width = ((i + 1) / slides.length * 100) + '%';
    if (!quiet) history.replaceState(null, '', '#slide-' + (i + 1));
  }
  function step(d) { show(cur + d); }

  function fit() {
    var k = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
    deck.style.transform = 'scale(' + k + ') translate(-50%,-50%)';
  }
  window.addEventListener('resize', fit);
  fit();

  document.getElementById('prev').onclick = function (e) { e.stopPropagation(); step(-1); };
  document.getElementById('next').onclick = function (e) { e.stopPropagation(); step(1); };
  document.getElementById('full').onclick = function (e) {
    e.stopPropagation();
    var d = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    else if (d.requestFullscreen) d.requestFullscreen(); else if (d.webkitRequestFullscreen) d.webkitRequestFullscreen();
  };
  document.addEventListener('keydown', function (e) {
    var fwd = rtl ? 'ArrowLeft' : 'ArrowRight', back = rtl ? 'ArrowRight' : 'ArrowLeft';
    if (e.key === fwd || e.key === 'PageDown' || e.key === ' ' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
    else if (e.key === back || e.key === 'PageUp' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
    else if (e.key === 'Home') show(0);
    else if (e.key === 'End') show(slides.length - 1);
    else if (e.key === 'f') document.getElementById('full').click();
    wake();
  });
  document.getElementById('stage').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var x = e.clientX / window.innerWidth;
    step((rtl ? x < 0.5 : x >= 0.5) ? 1 : -1);
  });
  var sx = null, sy = null;
  document.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
  document.addEventListener('touchend', function (e) {
    if (sx === null) return;
    var dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) step((dx < 0) !== rtl ? 1 : -1);
  });

  var bar = document.getElementById('bar'), t;
  function wake() { bar.classList.remove('idle'); clearTimeout(t); t = setTimeout(function () { bar.classList.add('idle'); }, 2600); }
  document.addEventListener('mousemove', wake);
  document.addEventListener('touchstart', wake, { passive: true });
  wake();

  var m = /^#slide-(\d+)$/.exec(location.hash);
  show(m ? parseInt(m[1], 10) - 1 : 0, !m);
})();
</script>
</body>
</html>
