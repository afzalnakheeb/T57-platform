<style>
/* Layout: white header, a full-bleed living scene per world, then calm light chapters. One look, committed (light chrome, night heroes). */
:root {
  --electric-green:#008b8c; --persian-indigo:#2f2e7d; --imperial-blue:#02246c; --electric-sapphire:#5b5fef;
  --persian-blue:#2641b3; --green-sprute:#0f766e; --strong-cyan:#39c4c4; --amber-flame:#f8b716;
  --gunmetal:#414042; --mint-cream:#f0f8f1; --night:#0b1340; --night-2:#131d55;
  --surface:#ffffff; --surface-alt:var(--mint-cream); --ink:var(--gunmetal); --ink-strong:var(--persian-indigo);
  --ink-muted:#5b5d6b; --line:#dde2ec; --line-strong:#7b7f8e; --accent:var(--green-sprute);
  --on-night:#ffffff; --on-night-muted:#c9cdf0;
  --world:var(--electric-green); --world-text:var(--strong-cyan); --world-ink:var(--imperial-blue);
  --font-display:Gilroy, Roboto, system-ui, sans-serif; --font-text:Gilroy, Roboto, system-ui, sans-serif;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.65,0,.35,1);
  color-scheme: light;
}
[data-world="financiers"] { --world:var(--amber-flame); --world-text:var(--amber-flame); --world-ink:var(--persian-indigo); }
[data-world="home"] { --world:var(--strong-cyan); --world-text:var(--strong-cyan); --world-ink:var(--imperial-blue); }
[data-world="governments"] { --world:var(--electric-sapphire); --world-text:#8f93ff; --world-ink:#ffffff; }
[data-world="traders"] { --world:var(--persian-blue); --world-text:var(--mint-cream); --world-ink:#ffffff; }
html { scroll-behavior:smooth; }
body { margin:0; background:var(--surface); color:var(--ink); font-family:var(--font-text); font-size:17px; line-height:28px; -webkit-font-smoothing:antialiased; }
*, *::before, *::after { box-sizing:border-box; }
a { color:var(--accent); text-underline-offset:3px; }
:focus-visible { outline:2px solid var(--electric-sapphire); outline-offset:3px; border-radius:4px; }
.night :focus-visible { outline-color:var(--amber-flame); }
.gutter { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width:1200px; margin:0 auto; }
h1, h2, h3 { text-wrap:balance; }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

/* Header */
body::before { content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top, 0px); z-index:40; background:#fff; }
.hdr { position:sticky; top:env(safe-area-inset-top, 0px); z-index:30; background:#ffffffeb; backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
.hdr-in { display:flex; align-items:center; gap:24px; min-height:72px; }
.logo { display:block; height:34px; width:auto; flex:none; }
.logo .petal { transition:opacity .35s var(--ease-out), transform .35s var(--ease-out); transform-box:fill-box; transform-origin:center; }
.logo.focus .petal:not(.on):not(.p-ring) { opacity:.18; }
.logo.focus .petal.on { transform:scale(1.12); }
.worlds { display:flex; gap:6px; margin-inline-start:auto; padding:4px; border-radius:999px; background:var(--surface-alt); }
.worlds a { display:inline-flex; align-items:center; gap:8px; min-height:40px; padding:0 16px; border-radius:999px; font:500 14px/20px var(--font-text); color:var(--ink-strong); text-decoration:none; white-space:nowrap; }
.worlds a i { width:8px; height:8px; border-radius:50%; flex:none; }
.worlds a span.long { margin-inline-start:-4px; }
.worlds a[aria-current="page"] { background:var(--persian-indigo); color:#fff; }
.hdr .demo { display:inline-flex; align-items:center; min-height:44px; padding:0 20px; border-radius:8px; background:var(--persian-indigo); color:#fff; text-decoration:none; font:500 15px/20px var(--font-text); }
.label-proto { font:500 11px/14px var(--font-text); letter-spacing:.16em; text-transform:uppercase; color:var(--ink-muted); }

/* Micro nav */
.micro { background:var(--persian-indigo); color:#fff; }
.micro-in { display:flex; align-items:center; gap:28px; min-height:52px; overflow-x:auto; scrollbar-width:none; }
.micro b { font:700 16px/20px var(--font-display); white-space:nowrap; display:flex; align-items:center; gap:10px; }
.micro b svg { width:22px; height:22px; flex:none; }
.micro a { color:var(--on-night-muted); text-decoration:none; font:500 14px/20px var(--font-text); white-space:nowrap; padding:16px 0 13px; border-bottom:3px solid transparent; }
.micro a[aria-current] { color:#fff; border-color:var(--world); }

/* Hero */
.hero { position:relative; overflow:hidden; background:var(--night); color:var(--on-night); isolation:isolate; }
.hero canvas { position:absolute; inset:0; width:100%; height:100%; z-index:-1; }
.hero::after { content:""; position:absolute; inset:0; z-index:-1; background:linear-gradient(90deg, #0b1340f2 0%, #0b1340b3 38%, #0b134000 70%); }
.hero-in { padding-block:clamp(72px, 11vw, 148px) clamp(80px, 12vw, 160px); display:grid; gap:28px; max-width:1200px; margin:0 auto; }
.hero-copy { max-width:640px; display:grid; gap:24px; }
.eyebrow { font:500 13px/16px var(--font-text); letter-spacing:.2em; text-transform:uppercase; color:var(--accent); margin:0; }
.night .eyebrow { color:var(--world-text); }
.hero h1 { font:700 clamp(38px, 5.2vw, 64px)/1.06 var(--font-display); letter-spacing:-.02em; margin:0; }
.hero h1 .ln { display:block; }
.hero p.std { font:400 clamp(18px, 1.6vw, 21px)/1.55 var(--font-text); color:var(--on-night-muted); margin:0; max-width:580px; }
.actions { display:flex; flex-wrap:wrap; gap:14px; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:48px; padding:0 24px; border-radius:8px; font:500 15px/20px var(--font-text); text-decoration:none; border:1.5px solid transparent; cursor:pointer; transition:background .15s, border-color .15s, color .15s; }
.btn-world { background:var(--world); color:var(--world-ink); }
[data-world="farmers"] .btn-world { background:var(--strong-cyan); color:var(--imperial-blue); }
.btn-world:hover { background:#fff; }
.btn-ghost { border-color:#c9cdf080; color:#fff; }
.btn-ghost:hover { border-color:#fff; }
.btn-indigo { background:var(--persian-indigo); color:#fff; }
.btn-indigo:hover { background:var(--imperial-blue); }
.scene-note { position:absolute; right:max(16px, env(safe-area-inset-right, 0px)); bottom:72px; max-width:min(420px, 40%); text-align:right; font:400 12px/16px var(--font-text); color:#c9cdf0b3; }

/* Cover photo slot */
.cover { position:relative; margin-top:-56px; z-index:2; }
.cover-frame { position:relative; border-radius:16px; overflow:hidden; aspect-ratio:21/8; max-width:100%; background:var(--night-2); box-shadow:0 24px 60px -24px #02246c66; }
.cover-frame .ph { position:absolute; inset:0; background:
  radial-gradient(120% 140% at 85% 20%, color-mix(in srgb, var(--world) 55%, transparent) 0%, transparent 55%),
  radial-gradient(90% 120% at 10% 100%, #2f2e7d 0%, transparent 60%), var(--night); }
.cover-frame .photo, .case-photo .photo { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.cover-frame .photo { transform:scale(1.08); transition:transform 2.4s cubic-bezier(.2,.8,.2,1); }
.cover-frame.in .photo { transform:scale(1); }
/* Our own data layer over photography (brand-drawn, not stock overlays) */
.cover-frame .overlay { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.overlay .box { fill:#0b1340d9; stroke:color-mix(in srgb, var(--world-text) 55%, transparent); stroke-width:1.5; }
.overlay .k { font:600 15px var(--font-text); letter-spacing:.14em; fill:var(--world-text); }
.overlay .v { font:500 21px var(--font-text); fill:#fff; }
.overlay .pt { fill:var(--world-text); }
.overlay .pt-ring { fill:none; stroke:var(--world-text); stroke-width:2; transform-box:fill-box; transform-origin:center; animation:ptpulse 2.4s ease-out infinite; }
.overlay .ld { fill:none; stroke:var(--world-text); stroke-width:1.5; stroke-dasharray:1; stroke-dashoffset:1; opacity:.8; }
.overlay .illus { font:500 14px var(--font-text); fill:#ffffffb3; letter-spacing:.08em; }
.overlay .tg { opacity:0; transform:translateY(10px); transition:opacity .6s var(--ease-out) var(--d), transform .6s var(--ease-out) var(--d); }
.overlay .tg .ld { transition:stroke-dashoffset .7s var(--ease-out) calc(var(--d) - .2s); }
.cover-frame.in .overlay .tg { opacity:1; transform:none; }
.cover-frame.in .overlay .tg .ld { stroke-dashoffset:0; }
.cover-frame.in .overlay .scan { animation:scan 5.5s cubic-bezier(.45,0,.55,1) .2s infinite; }
@keyframes scan { 0% { transform:translateX(0); } 70%,100% { transform:translateX(2060px); } }
@keyframes ptpulse { 0% { transform:scale(.4); opacity:.9; } 100% { transform:scale(1.8); opacity:0; } }
@media (max-width: 640px) { .overlay .tg:nth-of-type(n+2) { display:none; } }
@media (prefers-reduced-motion: reduce) { .overlay .scan, .overlay .pt-ring { animation:none; display:none; } .overlay .tg { transition:none; } }
.cover-frame svg.wm { position:absolute; right:6%; top:50%; height:70%; width:auto; transform:translateY(-50%); opacity:.22; }
.cover-box { position:absolute; left:24px; bottom:24px; max-width:min(50%, 520px); padding:24px; border-radius:8px; background:#ffffffcc; color:var(--imperial-blue); display:grid; gap:6px; }
.cover-box b { font:500 12px/16px var(--font-text); letter-spacing:.2em; text-transform:uppercase; color:var(--green-sprute); }
.cover-box span { font:400 15px/22px var(--font-text); }

/* Chapters */
.chapter { padding-block:clamp(72px, 9vw, 112px); }
.chapter.alt { background:var(--surface-alt); }
.h2 { font:700 clamp(30px, 3.4vw, 42px)/1.15 var(--font-display); letter-spacing:-.01em; color:var(--ink-strong); margin:0 0 16px; max-width:820px; }
.lede { font:400 19px/30px var(--font-text); margin:0; max-width:760px; }
.problems { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap:40px; margin-top:56px; }
.problem { display:grid; gap:14px; align-content:start; min-width:0; }
.problem svg { width:96px; height:72px; fill:none; stroke:var(--persian-indigo); stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; }
.problem svg .hl { stroke:var(--world); }
[data-world="farmers"] .problem svg .hl { stroke:var(--electric-green); }
.problem h3 { font:500 22px/30px var(--font-display); color:var(--ink-strong); margin:0; }
.problem p { margin:0; font-size:16px; line-height:26px; }

/* Steps with scroll rail */
.steps { position:relative; list-style:none; margin:56px 0 0; padding:0; display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:32px; }
.steps .rail { position:absolute; top:25px; left:26px; right:26px; height:2px; background:var(--line); }
.steps .rail i { position:absolute; inset:0; transform-origin:left; transform:scaleX(var(--p, 1)); background:linear-gradient(90deg, var(--electric-green), var(--persian-indigo)); }
.steps li { position:relative; display:grid; gap:12px; align-content:start; min-width:0; }
.steps .dot { width:52px; height:52px; border-radius:50%; display:grid; place-items:center; background:#fff; border:2px solid var(--line-strong); font:700 15px/1 var(--font-display); color:var(--ink-strong); transition:border-color .3s, background .3s, color .3s; }
.steps li.on .dot { border-color:var(--electric-green); background:var(--persian-indigo); color:#fff; }
.steps h3 { font:500 21px/29px var(--font-display); color:var(--ink-strong); margin:0; }
.steps p { margin:0; font-size:16px; line-height:26px; }

/* Ledger */
.ledger-sec { background:var(--night); color:#fff; }
.ledger-sec .h2 { color:#fff; }
.ledger-sec .lede { color:var(--on-night-muted); }
.ledger { margin-top:48px; overflow-x:auto; }
.ledger svg { width:100%; min-width:760px; height:auto; display:block; }
.ledger .hex { fill:none; stroke:#c9cdf0; opacity:.12; }
.ledger .route { stroke:#c9cdf0; stroke-dasharray:3 6; opacity:.55; fill:none; }
.ledger .node { fill:var(--night); stroke:var(--world); stroke-width:1.6; }
[data-world="farmers"] .ledger .node, [data-world="farmers"] .ledger .blk, [data-world="farmers"] .ledger .chain { stroke:var(--strong-cyan); }
.ledger .core { fill:var(--world); }
[data-world="farmers"] .ledger .core, [data-world="farmers"] .ledger .blk-on { fill:var(--strong-cyan); }
.ledger .pulse { fill:var(--amber-flame); }
[data-world="financiers"] .ledger .pulse { fill:#fff; }
.ledger .blk { fill:none; stroke:var(--world); stroke-width:1.25; }
.ledger .blk-on { fill:var(--world); opacity:0; }
.ledger .chain { stroke:var(--world); stroke-width:1.25; }
.ledger .drop { stroke:#c9cdf0; stroke-dasharray:2 5; opacity:.45; }
.ledger .ai { fill:none; stroke:#8f93ff; stroke-dasharray:2 6; stroke-width:1.5; }
.ledger .l1 { font:500 15px var(--font-text); fill:#fff; }
.ledger .l2 { font:400 11px var(--font-text); fill:#c9cdf0; letter-spacing:.1em; }
.ledger .pulse { animation:carry 10s linear infinite; }
@keyframes carry { 0%,10% { transform:translateX(0); opacity:1; } 20%,30% { transform:translateX(220px); } 40%,50% { transform:translateX(440px); } 60%,70% { transform:translateX(660px); } 80%,94% { transform:translateX(880px); opacity:1; } 100% { transform:translateX(880px); opacity:0; } }
.ledger .k1 { animation:lit1 10s infinite; } .ledger .k2 { animation:lit2 10s infinite; } .ledger .k3 { animation:lit3 10s infinite; } .ledger .k4 { animation:lit4 10s infinite; } .ledger .k5 { animation:lit5 10s infinite; }
@keyframes lit1 { 0%,5% { opacity:0; } 8%,94% { opacity:.4; } 100% { opacity:0; } }
@keyframes lit2 { 0%,24% { opacity:0; } 27%,94% { opacity:.4; } 100% { opacity:0; } }
@keyframes lit3 { 0%,44% { opacity:0; } 47%,94% { opacity:.4; } 100% { opacity:0; } }
@keyframes lit4 { 0%,64% { opacity:0; } 67%,94% { opacity:.4; } 100% { opacity:0; } }
@keyframes lit5 { 0%,84% { opacity:0; } 87%,94% { opacity:.4; } 100% { opacity:0; } }

/* Use case */
.case { display:grid; grid-template-columns:minmax(0, 5fr) minmax(0, 6fr); gap:48px; margin-top:48px; align-items:start; }
.case-photo { position:relative; border-radius:16px; overflow:hidden; aspect-ratio:4/5; max-width:100%; background:var(--night); }
.case-photo .ph { position:absolute; inset:0; background:radial-gradient(100% 80% at 70% 15%, color-mix(in srgb, var(--world) 45%, transparent), transparent 60%), linear-gradient(180deg, #2f2e7d, var(--night)); }
.case-photo .cap { position:absolute; left:16px; right:16px; bottom:16px; padding:16px; border-radius:8px; background:#ffffffcc; color:var(--imperial-blue); font-size:14px; line-height:20px; }
.case-photo .cap b { display:block; font:500 11px/14px var(--font-text); letter-spacing:.2em; text-transform:uppercase; color:var(--green-sprute); margin-bottom:4px; }
.case-body { display:grid; gap:24px; min-width:0; }
.case-body h3 { font:500 13px/16px var(--font-text); letter-spacing:.2em; text-transform:uppercase; color:var(--ink-muted); margin:0 0 6px; }
.case-body p { margin:0; }
.tranche { display:grid; gap:10px; padding:24px; border:1px solid var(--line); border-radius:16px; background:#fff; }
.tranche-bar { display:grid; grid-template-columns:2fr 3fr 3fr; gap:6px; }
.tranche-bar span { height:14px; border-radius:7px; background:var(--line); position:relative; overflow:hidden; }
.tranche-bar span i { position:absolute; inset:0; background:var(--persian-indigo); transform-origin:left; transform:scaleX(0); }
.tranche.run .tranche-bar span:nth-child(1) i { animation:fill 1s .2s var(--ease-out) forwards; }
.tranche.run .tranche-bar span:nth-child(2) i { animation:fill 1s 1.4s var(--ease-out) forwards; }
.tranche.run .tranche-bar span:nth-child(3) i { animation:fill 1s 2.6s var(--ease-out) forwards; }
@keyframes fill { to { transform:scaleX(1); } }
.tranche-legend { display:grid; grid-template-columns:2fr 3fr 3fr; gap:6px; font-size:13px; line-height:18px; color:var(--ink-muted); }

/* CTA */
.cta { position:relative; overflow:hidden; background:var(--night); color:#fff; }
.cta-in { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:40px; padding-block:96px; max-width:1200px; margin:0 auto; }
.cta h2 { font:700 clamp(28px, 3.2vw, 40px)/1.2 var(--font-display); margin:0 0 20px; max-width:640px; }
.cta .petal-big { width:min(300px, 60vw); height:auto; animation:breathe 6s var(--ease-in-out) infinite; filter:drop-shadow(0 0 40px color-mix(in srgb, var(--world) 40%, transparent)); }
@keyframes breathe { 50% { transform:scale(1.05) rotate(2deg); } }

/* Footer */
.ftr { background:#070d2e; color:#c9cdf0; font-size:14px; line-height:22px; padding-block:40px; }
.replay { font:inherit; color:#39c4c4; background:none; border:1px solid rgba(57,196,196,.4); border-radius:999px; padding:4px 14px; cursor:pointer; }
.tones { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
.replay[aria-pressed="true"] { background:#39c4c4; color:#0b1340; border-color:#39c4c4; }
.replay:hover { background:rgba(57,196,196,.12); }
.ftr-in { max-width:1200px; margin:0 auto; display:flex; flex-wrap:wrap; justify-content:space-between; gap:16px; }

/* Transition overlay */
.veil { position:fixed; inset:0; z-index:100; pointer-events:none; display:grid; place-items:center; visibility:hidden; }
.veil.go { visibility:visible; pointer-events:auto; }
.veil .bg { position:absolute; inset:0; background:var(--night); opacity:0; }
.veil svg.arc { position:absolute; inset:0; width:100%; height:100%; }
.veil svg.arc path { fill:none; stroke:var(--persian-indigo); }
.veil svg.arc path.sweep { stroke:url(#veil-sweep); }
.veil .mark { position:relative; width:min(46vmin, 360px); height:auto; opacity:0; }
.veil .mark .petal { transform-box:fill-box; transform-origin:center; }
.veil .dest { position:absolute; bottom:18%; left:0; right:0; text-align:center; font:500 13px/16px var(--font-text); letter-spacing:.24em; text-transform:uppercase; color:var(--on-night-muted); opacity:0; }

/* Worlds 3 and 4: Governments (sapphire) and Traders (Persian blue). Light accents on night use --world-text. */
[data-world="governments"] .btn-world:hover, [data-world="traders"] .btn-world:hover { color:var(--imperial-blue); }
[data-world="governments"] .ledger .node, [data-world="governments"] .ledger .blk, [data-world="governments"] .ledger .chain,
[data-world="traders"] .ledger .node, [data-world="traders"] .ledger .blk, [data-world="traders"] .ledger .chain { stroke:var(--world-text); }
[data-world="governments"] .ledger .core, [data-world="governments"] .ledger .blk-on,
[data-world="traders"] .ledger .core, [data-world="traders"] .ledger .blk-on { fill:var(--world-text); }
[data-world="traders"] .ledger .pulse { fill:var(--strong-cyan); }
.micro b svg[viewBox^="774"] { width:26px; height:26px; }
.stat { font-weight:700; color:var(--ink-strong); }

/* Scenario infographic (Governments use case) */
.scenario { position:relative; border-radius:16px; overflow:hidden; background:var(--night); color:#fff; max-width:100%; }
.scenario svg { display:block; width:100%; height:auto; }
.scenario .sc-k { font:600 13px var(--font-text); letter-spacing:.16em; fill:#8f93ff; }
.scenario .sc-grid { stroke:#c9cdf0; opacity:.12; }
.scenario .sc-base, .scenario .sc-no, .scenario .sc-yes { fill:none; stroke-width:3; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; }
.scenario .sc-base { stroke:#c9cdf0; }
.scenario .sc-no { stroke:var(--amber-flame); stroke-dasharray:.012 .02; stroke-dashoffset:0; opacity:0; }
.scenario .sc-yes { stroke:var(--strong-cyan); }
.scenario .sc-l { font:500 14px var(--font-text); opacity:0; }
.scenario .sc-l.no { fill:var(--amber-flame); } .scenario .sc-l.yes { fill:var(--strong-cyan); }
.scenario .sc-track { stroke:#c9cdf0; opacity:.25; stroke-dasharray:3 6; }
.scenario .sc-step circle { fill:var(--night); stroke:#8f93ff; stroke-width:2; transition:fill .4s; transition-delay:calc(var(--i) * .45s + .3s); }
.scenario .sc-step text { font:400 16px var(--font-text); fill:#c9cdf0; opacity:.45; transition:opacity .4s, fill .4s; transition-delay:calc(var(--i) * .45s + .3s); }
.scenario.run .sc-step circle { fill:#8f93ff; }
.scenario.run .sc-step text { opacity:1; fill:#fff; }
.scenario.run .sc-base { animation:dash .8s var(--ease-out) forwards; }
.scenario.run .sc-no { animation:fadein .6s 1s forwards; }
.scenario.run .sc-yes { animation:dash 1.4s 1.4s var(--ease-out) forwards; }
.scenario.run .sc-l.no { animation:fadein .4s 1.4s forwards; }
.scenario.run .sc-l.yes { animation:fadein .4s 2.6s forwards; }
@keyframes dash { to { stroke-dashoffset:0; } }
@keyframes fadein { to { opacity:1; } }
.scenario figcaption { padding:0 24px 24px; font-size:14px; line-height:20px; color:#c9cdf0; }
.scenario figcaption b { display:block; font:500 11px/14px var(--font-text); letter-spacing:.2em; text-transform:uppercase; color:#8f93ff; margin-bottom:4px; }

/* Competing lender offers (Traders use case) */
.offers { display:grid; gap:10px; padding:24px; border:1px solid var(--line); border-radius:16px; background:#fff; }
.offer { display:grid; grid-template-columns:72px 1fr 84px; align-items:center; gap:12px; font-size:14px; line-height:20px; color:var(--ink-muted); }
.offer i { height:12px; border-radius:6px; background:var(--line); position:relative; overflow:hidden; }
.offer i::after { content:""; position:absolute; inset:0; width:calc(var(--w) * 100%); background:#c9cdf0; transform-origin:left; transform:scaleX(0); transition:transform 1s var(--ease-out); }
.offer.best i::after { background:var(--persian-blue); }
.offer em { font-style:normal; font:500 12px/16px var(--font-text); letter-spacing:.12em; text-transform:uppercase; color:var(--persian-blue); opacity:0; transition:opacity .4s 1.6s; }
.offers.run .offer i::after { transform:scaleX(1); }
.offers.run .offer:nth-child(2) i::after { transition-delay:.25s; } .offers.run .offer:nth-child(3) i::after { transition-delay:.5s; }
.offers.run .offer em { opacity:1; }
.offers-note { margin:4px 0 0; font-size:13px; line-height:18px; color:var(--ink-muted); }

/* Home: hero with a live quote card and ticker, then the Global Food Market Board */
:root { --up:var(--strong-cyan); --down:var(--amber-flame); }
.up { color:var(--up); } .down { color:var(--down); }
.home-hero { padding-bottom:0; }
.home-hero .hero-in { padding-block:clamp(56px, 8vw, 112px) clamp(40px, 5vw, 64px); }
.home-in { grid-template-columns:minmax(0, 1fr) minmax(0, 380px); align-items:end; }
.quote-card { display:grid; gap:10px; padding:24px; border-radius:16px; background:#0b1340cc; border:1px solid #39c4c455; color:#fff; text-decoration:none; backdrop-filter:blur(6px); transition:border-color .2s, transform .2s; }
.quote-card:hover { border-color:var(--strong-cyan); transform:translateY(-2px); }
.qc-k { font:500 12px/16px var(--font-text); letter-spacing:.2em; text-transform:uppercase; color:var(--on-night-muted); }
.qc-v { display:flex; align-items:baseline; gap:14px; }
.qc-v b { font:700 56px/1 var(--font-display); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
.qc-v em { font:600 18px/1 var(--font-text); font-style:normal; }
.qc-spark { width:100%; height:64px; }
.qc-spark path { fill:none; stroke:var(--strong-cyan); stroke-width:2; vector-effect:non-scaling-stroke; }
.qc-foot { display:flex; justify-content:space-between; gap:12px; font-size:13px; line-height:18px; color:var(--on-night-muted); }
.ticker { position:relative; margin:0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))) 0; border-top:1px solid #c9cdf026; border-bottom:1px solid #c9cdf026; background:#070d2ecc; overflow:hidden; }
.ticker-track { display:flex; width:max-content; animation:marquee 70s linear infinite; }
.ticker:hover .ticker-track { animation-play-state:paused; }
.tk-run { display:flex; }
.tk { display:inline-flex; align-items:baseline; gap:8px; padding:14px 28px; white-space:nowrap; font:400 14px/20px var(--font-text); color:#fff; font-variant-numeric:tabular-nums; border-right:1px solid #c9cdf01f; }
.tk b { font-weight:500; color:var(--on-night-muted); }
.tk em { font-style:normal; font-weight:600; }
@keyframes marquee { to { transform:translateX(-50%); } }
.board { padding-block:clamp(72px, 9vw, 112px); background:var(--night); color:#fff; }
.board .h2 { color:#fff; } .board .lede { color:var(--on-night-muted); }
.board-head { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:end; gap:24px; }
.stamp { margin:0; font-size:14px; line-height:22px; color:#fff; text-align:right; }
.stamp span:not(.live-dot) { color:var(--on-night-muted); font-size:13px; }
.live-dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--strong-cyan); margin-inline-end:8px; box-shadow:0 0 0 0 #39c4c4aa; animation:livepulse 2s infinite; }
@keyframes livepulse { 70% { box-shadow:0 0 0 10px #39c4c400; } 100% { box-shadow:0 0 0 0 #39c4c400; } }
.panel { border:1px solid #c9cdf026; border-radius:16px; background:#131d55aa; padding:24px; min-width:0; }
.panel-k { display:block; margin:0 0 14px; font:500 12px/16px var(--font-text); letter-spacing:.18em; text-transform:uppercase; color:var(--on-night-muted); }
.src { margin:14px 0 0; font-size:12px; line-height:18px; color:#c9cdf0b3; }
.board-grid { display:grid; grid-template-columns:minmax(0, 7fr) minmax(0, 4fr); gap:20px; margin-top:40px; }
.tabs { display:flex; flex-wrap:wrap; gap:6px; }
.tabs button { font:500 13px/18px var(--font-text); color:var(--on-night-muted); background:none; border:1px solid #c9cdf033; border-radius:999px; padding:7px 14px; min-height:36px; cursor:pointer; }
.tabs button[aria-selected="true"] { background:var(--strong-cyan); border-color:var(--strong-cyan); color:var(--imperial-blue); }
.chart-top { display:flex; flex-wrap:wrap; align-items:baseline; gap:16px; margin:20px 0 6px; }
.chart-v { font:700 40px/1 var(--font-display); color:#fff; font-variant-numeric:tabular-nums; }
.chart-d { font-size:14px; color:var(--on-night-muted); } .chart-d em { font-style:normal; font-weight:600; }
.chart-wrap { position:relative; }
.chart { width:100%; height:auto; display:block; touch-action:pan-y; }
.chart .gl { stroke:#c9cdf0; opacity:.1; }
.chart .ax { font:400 12px var(--font-text); fill:#c9cdf0b3; }
.chart .area { fill:url(#chartFill); }
.chart .line { fill:none; stroke:var(--strong-cyan); stroke-width:2.5; stroke-linejoin:round; stroke-dasharray:1; }
.chart .end { fill:var(--strong-cyan); }
.chart .cross { stroke:#c9cdf0; stroke-dasharray:3 4; opacity:.6; }
.chart .hov { fill:#fff; stroke:var(--strong-cyan); stroke-width:2; }
.chart-tip { position:absolute; transform:translate(-50%, calc(-100% - 14px)); padding:6px 10px; border-radius:6px; background:#fff; color:var(--imperial-blue); font-size:12px; line-height:16px; white-space:nowrap; pointer-events:none; display:grid; }
.chart-tip b { font-size:15px; }
.chart-tip[hidden] { display:none; }
.mv-list { list-style:none; margin:0; padding:0; display:grid; gap:4px; }
.mv-list li { display:grid; grid-template-columns:minmax(0, 1fr) auto auto; column-gap:12px; align-items:baseline; padding:10px 0; border-bottom:1px solid #c9cdf01a; font-size:14px; line-height:20px; color:#fff; font-variant-numeric:tabular-nums; }
.mv-p { color:var(--on-night-muted); } .mv-c { font-weight:600; min-width:68px; text-align:right; }
.mv-bar { grid-column:1 / -1; height:3px; margin-top:8px; border-radius:2px; background:currentColor; width:calc(var(--w) * 100%); transform-origin:left; }
.mv-bar.up { color:var(--up); } .mv-bar.down { color:var(--down); }
.heat { margin-top:20px; }
.heat-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap:18px; }
.hg-k { display:block; font-size:12px; line-height:16px; color:var(--on-night-muted); margin-bottom:8px; }
.hg-tiles { display:grid; gap:6px; }
.tile { display:grid; grid-template-columns:minmax(0, 1fr) auto; gap:2px 10px; padding:10px 12px; border-radius:8px; color:#fff; font-variant-numeric:tabular-nums; background:color-mix(in srgb, var(--tile) calc(var(--a) * 100%), #0b1340); border:1px solid color-mix(in srgb, var(--tile) 40%, transparent); }
.tile.up { --tile:#008b8c; } .tile.down { --tile:#b07d08; }
.t-n { font-size:13px; line-height:18px; } .t-p { font:600 15px/20px var(--font-text); grid-row:2; } .t-p small { font-weight:400; font-size:11px; color:#ffffffb3; }
.t-c { grid-row:1 / 3; grid-column:2; align-self:center; font:600 14px/1 var(--font-text); }
.pulse { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap:20px; margin-top:20px; }
.stat .big { display:block; font:700 clamp(28px, 3vw, 38px)/1.1 var(--font-display); color:#fff; font-variant-numeric:tabular-nums; }
.stat .big.up { color:var(--up); } .stat .big.muted { color:#c9cdf0b3; }
.soon { border-style:dashed; }
.doors { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 240px), 1fr)); gap:20px; margin-top:40px; }
.door { display:grid; gap:10px; align-content:start; padding:28px 24px; border-radius:16px; border:1px solid var(--line); background:#fff; color:var(--ink); text-decoration:none; transition:border-color .2s, transform .2s, box-shadow .2s; }
.door:hover { border-color:var(--c); transform:translateY(-3px); box-shadow:0 18px 40px -24px #02246c66; }
.door svg { width:56px; height:56px; filter:drop-shadow(0 0 0 transparent); }
.door b { font:500 20px/26px var(--font-display); color:var(--ink-strong); } .door span { font-size:15px; line-height:24px; }
@media (max-width: 900px) { .home-in, .board-grid { grid-template-columns:minmax(0, 1fr); } .stamp { text-align:left; } }
@media (prefers-reduced-motion: reduce) { .ticker { overflow-x:auto; } .ticker-track { animation:none; } }

.world[hidden] { display:none !important; }

.hdr .demo, .label-proto { white-space:nowrap; }
@media (max-width: 1480px) { .label-proto { display:none; } }
@media (max-width: 1320px) { .worlds a span.long { display:none; } }
@media (max-width: 640px) {
  .hdr-in { flex-wrap:wrap; row-gap:0; padding-top:8px; min-height:60px; }
  .worlds { order:3; flex:1 0 100%; margin:0 0 10px; overflow-x:auto; scrollbar-width:none; border-radius:12px; }
  .scene-note { display:none; }
}
@media (max-width: 900px) {
  .steps { grid-template-columns:repeat(2, minmax(0, 1fr)); }
  .steps .rail { display:none; }
  .case { grid-template-columns:minmax(0, 1fr); }
  .case-photo { aspect-ratio:16/10; }
  .cover-frame { aspect-ratio:16/10; }
  .cover-box { max-width:calc(100% - 32px); left:16px; bottom:16px; padding:16px; }
  .label-proto, .hdr .demo { display:none; }
  .scenario .sc-step text { font-size:17px; }
}
@media (max-width: 640px) {
  .worlds a span.long { display:none; }
  .hdr-in { gap:12px; }
  .logo { height:26px; }
  .worlds a { padding:0 12px; gap:6px; font-size:13px; }
  .hero::after { background:linear-gradient(180deg, #0b1340cc 0%, #0b1340e6 60%); }
  .steps { grid-template-columns:minmax(0, 1fr); }
  .cover { margin-top:-32px; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior:auto; }
  *, *::before, *::after { animation:none !important; transition:none !important; }
  .ledger .blk-on { opacity:.4; }
  .tranche-bar span i { transform:scaleX(1); }
  .scenario .sc-base, .scenario .sc-yes { stroke-dashoffset:0; } .scenario .sc-no, .scenario .sc-l { opacity:1; }
  .scenario .sc-step text { opacity:1; fill:#fff; } .scenario .sc-step circle { fill:#8f93ff; }
  .offer i::after { transform:scaleX(1); } .offer em { opacity:1; }
}
</style>
